<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerflak</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    body { margin:0; font-family: -apple-system, sans-serif; background:#111; color:#eee; height:100dvh; display:flex; }
    nav { width:64px; background:#1c1c1c; display:flex; flex-direction:column; align-items:center; padding-top:16px; gap:16px; }
    nav .icon { width:32px; height:32px; border-radius:8px; background:#333; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; }
    nav .icon.active { background:#4a7; }
    main { flex:1; display:flex; align-items:safe center; justify-content:safe center; padding:24px; box-sizing:border-box; overflow-y:auto; }
    .welcome h1 { font-weight:400; }
    .panel { width:100%; max-width:600px; display:flex; flex-direction:column; gap:16px; }
    .panel textarea { width:100%; height:280px; background:#1a1a1a; color:#eee; border:1px solid #333; border-radius:8px; padding:12px; font-family:monospace; font-size:14px; box-sizing:border-box; resize:vertical; }
    .panel input[type=text], .panel input[type=password] { background:#1a1a1a; color:#eee; border:1px solid #333; border-radius:6px; padding:8px 10px; box-sizing:border-box; font-family:monospace; flex:1; min-width:140px; }
    .panel .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .panel button { background:#333; color:#eee; border:1px solid #444; border-radius:6px; padding:8px 14px; cursor:pointer; }
    .panel button:hover { background:#444; }
    .panel button:disabled { opacity:0.5; cursor:default; }
    .panel .status { font-size:13px; color:#999; min-height:18px; }
    .panel .link-btn { background:none; border:none; color:#7ab; text-decoration:underline; padding:0; font-size:13px; }
    .recovery-box { background:#1a1a1a; border:2px solid #4a7; border-radius:8px; padding:16px; }
    .recovery-code { font-family:monospace; font-size:16px; word-break:break-all; color:#4a7; margin:10px 0; }
    .warning { color:#e94; font-size:13px; }

    /* --- Barre de formatage --- */
    .toolbar-row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .tb-btn { background:#333; color:#eee; border:1px solid #444; border-radius:6px; width:34px; height:34px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; }
    .tb-btn:hover { background:#444; }
    .tb-btn.active { background:#4a7; border-color:#4a7; }
    .tb-sep { width:1px; height:22px; background:#444; margin:0 4px; }
    .tb-select { background:#1a1a1a; color:#eee; border:1px solid #333; border-radius:6px; padding:6px 8px; font-family:monospace; }
    .editor { width:100%; min-height:280px; background:#1a1a1a; color:#eee; border:1px solid #333; border-radius:8px; padding:12px; font-family:'Bookman Old Style','Book Antiqua',Palatino,serif; font-size:11pt; box-sizing:border-box; overflow-y:auto; }
    .editor:focus { outline:1px solid #4a7; }
    .editor:empty:before { content: attr(data-placeholder); color:#666; }
  </style>
</head>
<body>
  <nav>
    <div class="icon" id="nav-scriptum" title="Scriptum">S</div>
    <div class="icon" id="nav-punkrecords" title="Punk Records">P</div>
    <div class="icon"></div>
    <div class="icon"></div>
    <div class="icon"></div>
    <div class="icon"></div>
  </nav>
  <main id="main-content">
    <div class="welcome"><h1>Cerflak</h1></div>
  </main>

  <script src="scriptum.js"></script>
  <script>
    const mainContent = document.getElementById('main-content');
    const navScriptum = document.getElementById('nav-scriptum');
    const navPunkRecords = document.getElementById('nav-punkrecords');
    const STORAGE_KEY = 'scriptum-wrapped-key';
    const KURA_API_BASE = 'https://scriptum-api.lesplumeslestees.fr';
    const KURA_API_SECRET = 'a3f92c81b47e05d6912fa338c7b90124de56af13c8091cd';
    const OTS_API_URL = 'https://scriptum-api.lesplumeslestees.fr/stamp';
    const SCRIPTUM_API_SECRET = '16beff6e00557ee6b6e29a680f5ae3ca6818ee247b3263aed26e2c0afc0f9399';

    let currentCryptoKey = null;
    let sessionPassword = null;

    async function sha256Base64(text) {
      const enc = new TextEncoder();
      const data = enc.encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const binary = hashArray.map(b => String.fromCharCode(b)).join('');
      return btoa(binary);
    }

    // --- Écran : définir un mot de passe local (protège la clé stockée sur cet appareil) ---
    function renderSetPasswordScreen(keyBytes, onDone) {
      mainContent.innerHTML = `
        <div class="panel">
          <h2>Protéger l'accès sur cet appareil</h2>
          <p>Choisis un mot de passe pour déverrouiller Scriptum rapidement ici. Note-le aussi dans Bitwarden.</p>
          <div class="row">
            <input type="password" id="s-pass1" placeholder="Mot de passe">
          </div>
          <div class="row">
            <input type="password" id="s-pass2" placeholder="Confirme le mot de passe">
          </div>
          <div class="row">
            <button id="s-pass-confirm">Valider</button>
          </div>
          <div class="status" id="s-pass-status"></div>
        </div>
      `;
      const statusEl = document.getElementById('s-pass-status');
      document.getElementById('s-pass-confirm').addEventListener('click', async () => {
        const p1 = document.getElementById('s-pass1').value;
        const p2 = document.getElementById('s-pass2').value;
        if (p1.length < 8) {
          statusEl.textContent = 'Le mot de passe doit faire au moins 8 caractères.';
          return;
        }
        if (p1 !== p2) {
          statusEl.textContent = 'Les deux mots de passe ne correspondent pas.';
          return;
        }
        statusEl.textContent = 'Protection en cours...';
        try {
          const wrapped = await Scriptum.wrapMasterKeyWithPassword(keyBytes, p1);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(wrapped));
          currentCryptoKey = await Scriptum.importMasterKey(keyBytes);
          sessionPassword = p1;
          onDone();
        } catch (e) {
          statusEl.textContent = 'Erreur : ' + e.message;
        }
      });
    }

    // --- Écran : déverrouillage par mot de passe (clé déjà protégée sur cet appareil) ---
    function renderUnlockScreen() {
      mainContent.innerHTML = `
        <div class="panel">
          <h2>Scriptum</h2>
          <div class="row">
            <input type="password" id="s-unlock-pass" placeholder="Mot de passe">
            <button id="s-unlock-btn">Déverrouiller</button>
          </div>
          <div class="status" id="s-unlock-status"></div>
          <button class="link-btn" id="s-forgot">Mot de passe oublié ? Restaurer avec un code de récupération</button>
        </div>
      `;
      const statusEl = document.getElementById('s-unlock-status');
      const passInput = document.getElementById('s-unlock-pass');

      async function attemptUnlock() {
        const wrapped = JSON.parse(localStorage.getItem(STORAGE_KEY));
        statusEl.textContent = 'Déverrouillage...';
        try {
          const keyBytes = await Scriptum.unwrapMasterKeyWithPassword(wrapped, passInput.value);
          currentCryptoKey = await Scriptum.importMasterKey(keyBytes);
          sessionPassword = passInput.value;
          renderEditor();
        } catch (e) {
          statusEl.textContent = 'Mot de passe incorrect.';
        }
      }

      document.getElementById('s-unlock-btn').addEventListener('click', attemptUnlock);
      passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptUnlock(); });
      document.getElementById('s-forgot').addEventListener('click', renderRestoreScreen);
    }

    // --- Écran : restauration depuis un code de récupération (mot de passe oublié) ---
    function renderRestoreScreen() {
      mainContent.innerHTML = `
        <div class="panel">
          <h2>Restaurer depuis un code de récupération</h2>
          <div class="row">
            <input type="text" id="s-restore-input" placeholder="Coller le code de récupération">
            <button id="s-restore-btn">Restaurer</button>
          </div>
          <div class="status" id="s-restore-status"></div>
        </div>
      `;
      const statusEl = document.getElementById('s-restore-status');
      document.getElementById('s-restore-btn').addEventListener('click', () => {
        const code = document.getElementById('s-restore-input').value.trim();
        try {
          const keyBytes = Scriptum.recoveryCodeToKey(code);
          renderSetPasswordScreen(keyBytes, renderEditor);
        } catch (e) {
          statusEl.textContent = 'Code invalide : ' + e.message;
        }
      });
    }

    // --- Écran : première utilisation (générer ou restaurer) ---
    function renderSetupScreen() {
      mainContent.innerHTML = `
        <div class="panel">
          <h2>Scriptum — Première utilisation</h2>
          <p>Génère une nouvelle clé, ou restaure-en une depuis un code de récupération existant.</p>
          <div class="row">
            <button id="s-generate">Générer une nouvelle clé</button>
            <span>ou</span>
            <input type="text" id="s-restore-input" placeholder="Coller un code de récupération existant">
            <button id="s-restore-btn">Restaurer</button>
          </div>
          <div class="status" id="s-setup-status"></div>
        </div>
      `;
      const statusEl = document.getElementById('s-setup-status');

      document.getElementById('s-generate').addEventListener('click', () => {
        try {
          const keyBytes = Scriptum.generateMasterKey();
          const code = Scriptum.keyToRecoveryCode(keyBytes);
          renderRecoveryScreen(code, keyBytes);
        } catch (e) {
          statusEl.textContent = 'Erreur : ' + (e.message || JSON.stringify(e));
        }
      });

      document.getElementById('s-restore-btn').addEventListener('click', () => {
        const code = document.getElementById('s-restore-input').value.trim();
        try {
          const keyBytes = Scriptum.recoveryCodeToKey(code);
          renderSetPasswordScreen(keyBytes, renderEditor);
        } catch (e) {
          statusEl.textContent = 'Code invalide : ' + e.message;
        }
      });
    }

    function renderRecoveryScreen(code, keyBytes) {
      mainContent.innerHTML = `
        <div class="panel">
          <div class="recovery-box">
            <h2>Ton code de récupération</h2>
            <p class="warning">Ce code ne sera plus jamais affiché. Note-le dans Bitwarden maintenant.</p>
            <div class="recovery-code">${code}</div>
          </div>
          <div class="row">
            <label><input type="checkbox" id="s-confirm-saved"> J'ai noté ce code dans Bitwarden</label>
          </div>
          <button id="s-continue" disabled>Continuer</button>
        </div>
      `;
      const checkbox = document.getElementById('s-confirm-saved');
      const continueBtn = document.getElementById('s-continue');
      checkbox.addEventListener('change', () => { continueBtn.disabled = !checkbox.checked; });
      continueBtn.addEventListener('click', () => renderSetPasswordScreen(keyBytes, renderEditor));
    }

    function renderShowRecoveryScreen(code) {
      mainContent.innerHTML = `
        <div class="panel">
          <div class="recovery-box">
            <h2>Code de récupération de cet appareil</h2>
            <p class="warning">Note-le dans Bitwarden maintenant.</p>
            <div class="recovery-code">${code}</div>
          </div>
          <button id="s-back-editor">Retour à l'éditeur</button>
        </div>
      `;
      document.getElementById('s-back-editor').addEventListener('click', renderEditor);
    }

    // --- Éditeur ---
    let currentGtext = null;
    let currentJsonContent = null;

    function renderEditor() {
      mainContent.innerHTML = `
        <div class="panel">
          <div class="row">
            <input type="text" id="s-subfolder" placeholder="Sous-dossier (ex: Plumaisons)">
            <input type="text" id="s-filename" placeholder="Nom du fichier (ex: poeme1)">
          </div>
          <div class="toolbar-row" id="fmt-toolbar">
            <button type="button" class="tb-btn" id="btn-bold" title="Gras (Ctrl+B)"><b>G</b></button>
            <button type="button" class="tb-btn" id="btn-italic" title="Italique (Ctrl+I)"><i>I</i></button>
            <button type="button" class="tb-btn" id="btn-underline" title="Souligné (Ctrl+U)"><u>S</u></button>
            <div class="tb-sep"></div>
            <button type="button" class="tb-btn" id="btn-align-left" title="Aligner à gauche">⇤</button>
            <button type="button" class="tb-btn" id="btn-align-center" title="Centrer">↔</button>
            <button type="button" class="tb-btn" id="btn-align-right" title="Aligner à droite">⇥</button>
            <button type="button" class="tb-btn" id="btn-align-justify" title="Justifier">≡</button>
            <div class="tb-sep"></div>
            <select class="tb-select" id="size-select" title="Taille">
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11" selected>11</option>
              <option value="12">12</option>
              <option value="14">14</option>
              <option value="16">16</option>
              <option value="18">18</option>
              <option value="20">20</option>
              <option value="24">24</option>
            </select>
          </div>
          <div id="s-text" class="editor" contenteditable="true" data-placeholder="Écris ici..."></div>
          <div class="row">
            <button id="s-encrypt">Chiffrer</button>
            <button id="s-ots" disabled>Horodater (OTS)</button>
            <button id="s-save" disabled>Enregistrer sur Kura</button>
            <button id="s-open">Ouvrir</button>
            <button id="s-export-pdf">Exporter en PDF</button>
            <button id="s-export-odt">Exporter en ODT</button>
            <button id="s-show-recovery">Voir le code de récupération</button>
          </div>
          <div class="status" id="s-status"></div>
        </div>
      `;
      const statusEl = document.getElementById('s-status');
      const otsBtn = document.getElementById('s-ots');
      const saveBtn = document.getElementById('s-save');
      const editor = document.getElementById('s-text');

      editor.style.fontSize = '11pt';

      // --- Formatage : gras / italique / souligné / alignements / taille ---
      let savedRange = null;
      function saveSelection() {
        const sel = window.getSelection();
        if (sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
          savedRange = sel.getRangeAt(0).cloneRange();
        }
      }
      function restoreSelection() {
        if (savedRange) {
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(savedRange);
        }
      }
      function updateToolbarState() {
        document.getElementById('btn-bold').classList.toggle('active', document.queryCommandState('bold'));
        document.getElementById('btn-italic').classList.toggle('active', document.queryCommandState('italic'));
        document.getElementById('btn-underline').classList.toggle('active', document.queryCommandState('underline'));
      }
      function fmt(cmd) {
        editor.focus();
        document.execCommand(cmd, false, null);
        updateToolbarState();
      }
      function applySize(size) {
        editor.focus();
        restoreSelection();
        const sel = window.getSelection();
        if (sel && sel.rangeCount > 0 && !sel.getRangeAt(0).collapsed) {
          document.execCommand('fontSize', false, '7');
          editor.querySelectorAll('font[size="7"]').forEach((el) => {
            const span = document.createElement('span');
            span.style.fontSize = size + 'pt';
            span.innerHTML = el.innerHTML;
            el.replaceWith(span);
          });
        } else {
          editor.style.fontSize = size + 'pt';
        }
      }

      document.getElementById('btn-bold').addEventListener('click', () => fmt('bold'));
      document.getElementById('btn-italic').addEventListener('click', () => fmt('italic'));
      document.getElementById('btn-underline').addEventListener('click', () => fmt('underline'));
      document.getElementById('btn-align-left').addEventListener('click', () => fmt('justifyLeft'));
      document.getElementById('btn-align-center').addEventListener('click', () => fmt('justifyCenter'));
      document.getElementById('btn-align-right').addEventListener('click', () => fmt('justifyRight'));
      document.getElementById('btn-align-justify').addEventListener('click', () => fmt('justifyFull'));

      const sizeSelect = document.getElementById('size-select');
      editor.addEventListener('mouseup', saveSelection);
      editor.addEventListener('keyup', saveSelection);
      sizeSelect.addEventListener('mousedown', saveSelection);
      sizeSelect.addEventListener('change', () => applySize(sizeSelect.value));

      document.addEventListener('selectionchange', () => {
        const sel = window.getSelection();
        if (document.activeElement === editor || (sel.anchorNode && editor.contains(sel.anchorNode))) {
          updateToolbarState();
        }
      });

      editor.addEventListener('input', () => {
        currentGtext = null;
        currentJsonContent = null;
        otsBtn.disabled = true;
        saveBtn.disabled = true;
      });

      document.getElementById('s-encrypt').addEventListener('click', async () => {
        const html = editor.innerHTML;
        statusEl.textContent = 'Chiffrement en cours...';
        try {
          currentGtext = await Scriptum.encryptWithKey(html, currentCryptoKey);
          currentJsonContent = JSON.stringify(currentGtext);
          otsBtn.disabled = false;
          saveBtn.disabled = false;
          statusEl.textContent = 'Texte chiffré, prêt à horodater et/ou enregistrer.';
        } catch (e) {
          statusEl.textContent = 'Erreur : ' + e.message;
        }
      });

      otsBtn.addEventListener('click', async () => {
        if (!currentJsonContent) return;
        statusEl.textContent = 'Horodatage OTS en cours...';
        try {
          const hash = await sha256Base64(currentJsonContent);
          const otsResp = await fetch(OTS_API_URL, {
            method: 'POST',
            headers: {
              'X-Api-Secret': SCRIPTUM_API_SECRET,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              hash,
              email: 'guillaumegabory@proton.me',
              content: currentJsonContent,
