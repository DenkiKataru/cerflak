<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Test WebAuthn / PRF (jetable)</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; line-height: 1.45; }
  h1 { font-size: 1.3rem; }
  button { display: block; width: 100%; padding: 14px; margin: 10px 0; font-size: 1rem; border-radius: 8px; border: 1px solid #888; background: #eef; }
  pre { background: #f4f4f4; padding: 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; min-height: 3em; }
  .verdict { font-weight: bold; padding: 12px; border-radius: 8px; margin-top: 12px; }
  .ok { background: #d8f5d8; } .ko { background: #fbdcdc; } .wait { background: #eee; }
  small { color: #555; }
</style>
</head>
<body>
<h1>Test WebAuthn / PRF — page jetable</h1>
<p><small>Cette page ne touche à rien dans Cerflak. Elle ne garde que l'identifiant de test dans ce navigateur et n'affiche jamais la clé entière, seulement une courte empreinte pour comparer.</small></p>

<button id="b1">1. Diagnostic</button>
<button id="b2">2. Créer l'identité (empreinte)</button>
<button id="b3">3. Dériver une clé (empreinte)</button>
<button id="b4">4. Revérifier (même clé ?)</button>
<button id="b5">Effacer le test et recommencer</button>

<pre id="log">Appuie sur « 1. Diagnostic » pour commencer.</pre>
<div id="verdict" class="verdict wait">Verdict : pas encore de résultat.</div>

<script>
'use strict';
const KEY_ID = 'cerflak-webauthn-test-credid';
// « Sel » fixe : même sel => même clé dérivée si PRF fonctionne.
const SALT = new TextEncoder().encode('cerflak-test-prf-v1');
const logEl = document.getElementById('log');
const verdictEl = document.getElementById('verdict');
let firstHash = null;

function log(msg) { logEl.textContent += '\n' + msg; }
function reset(msg) { logEl.textContent = msg; }
function verdict(text, cls) { verdictEl.textContent = 'Verdict : ' + text; verdictEl.className = 'verdict ' + cls; }
const toHex = (buf) => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function shortHash(buf) { // empreinte courte : on n'affiche jamais la clé elle-même
  return toHex(await crypto.subtle.digest('SHA-256', buf)).slice(0, 16);
}
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

document.getElementById('b1').onclick = async () => {
  reset('Diagnostic :');
  log('Navigateur : ' + navigator.userAgent);
  log('Adresse sécurisée (https) : ' + (window.isSecureContext ? 'oui' : 'NON'));
  log('WebAuthn disponible : ' + (window.PublicKeyCredential ? 'oui' : 'NON'));
  if (!window.PublicKeyCredential) { verdict('ce navigateur ne sait pas faire de WebAuthn.', 'ko'); return; }
  try {
    const ok = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    log('Capteur intégré (empreinte / Touch ID) utilisable : ' + (ok ? 'oui' : 'NON'));
  } catch (e) { log('Capteur : erreur ' + e.message); }
  try {
    if (PublicKeyCredential.getClientCapabilities) {
      const caps = await PublicKeyCredential.getClientCapabilities();
      log('Extension PRF annoncée par le navigateur : ' + (caps['extension:prf'] === undefined ? 'inconnu' : (caps['extension:prf'] ? 'oui' : 'non')));
    } else {
      log('Le navigateur ne dit pas à l\'avance s\'il gère PRF : il faudra faire les étapes 2 et 3.');
    }
  } catch (e) { log('Capacités : erreur ' + e.message); }
  log('Identité de test déjà créée ici : ' + (load(KEY_ID) ? 'oui' : 'non'));
  verdict('diagnostic fait, passe à l\'étape 2.', 'wait');
};

document.getElementById('b2').onclick = async () => {
  reset('Création de l\'identité…');
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: 'Cerflak test jetable' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'test', displayName: 'Test Cerflak' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
      extensions: { prf: {} },
      timeout: 60000,
    }});
    store(KEY_ID, b64(cred.rawId));
    const prf = cred.getClientExtensionResults().prf;
    log('Identité créée.');
    log('PRF signalée à la création : ' + (prf && prf.enabled ? 'OUI' : 'non / non précisé'));
    log('(Le vrai test est l\'étape 3 : certains appareils ne le disent qu\'à ce moment-là.)');
    verdict('identité créée, passe à l\'étape 3.', 'wait');
  } catch (e) {
    log('Échec : ' + e.name + ' — ' + e.message);
    verdict('création impossible (' + e.name + ').', 'ko');
  }
};

async function derive() {
  const id = load(KEY_ID);
  if (!id) throw new Error('Pas d\'identité : fais d\'abord l\'étape 2.');
  const assertion = await navigator.credentials.get({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials: [{ type: 'public-key', id: unb64(id) }],
    userVerification: 'required',
    extensions: { prf: { eval: { first: SALT } } },
    timeout: 60000,
  }});
  const res = assertion.getClientExtensionResults().prf;
  if (!res || !res.results || !res.results.first) return null;
  return shortHash(res.results.first);
}

document.getElementById('b3').onclick = async () => {
  reset('Dérivation de la clé…');
  try {
    const h = await derive();
    if (!h) {
      log('Aucune clé renvoyée : PRF ne fonctionne pas ici.');
      verdict('PRF ne marche pas ici : l\'empreinte ne servira que de verrou d\'écran, le mot de passe reste la vraie protection.', 'ko');
      return;
    }
    firstHash = h;
    log('Clé dérivée. Empreinte courte : ' + h);
    verdict('PRF répond. Fais l\'étape 4 pour vérifier que la clé est stable.', 'wait');
  } catch (e) {
    log('Échec : ' + e.name + ' — ' + e.message);
    verdict('dérivation impossible (' + e.name + ').', 'ko');
  }
};

document.getElementById('b4').onclick = async () => {
  reset('Revérification…');
  try {
    const h = await derive();
    if (!h) { verdict('PRF ne marche pas ici : l\'empreinte ne servira que de verrou d\'écran, le mot de passe reste la vraie protection.', 'ko'); return; }
    log('Empreinte courte : ' + h);
    if (firstHash === null) { log('Pas de comparaison possible : refais l\'étape 3 avant, dans cette même page.'); verdict('étape 3 manquante.', 'wait'); return; }
    if (h === firstHash) {
      log('Identique à l\'étape 3 : la clé est stable.');
      verdict('PRF fonctionne : l\'empreinte peut dériver une clé de chiffrement stable.', 'ok');
    } else {
      log('DIFFÉRENTE de l\'étape 3 : la clé n\'est pas stable.');
      verdict('PRF instable : inutilisable pour chiffrer.', 'ko');
    }
  } catch (e) {
    log('Échec : ' + e.name + ' — ' + e.message);
    verdict('revérification impossible (' + e.name + ').', 'ko');
  }
};

document.getElementById('b5').onclick = () => {
  try { localStorage.removeItem(KEY_ID); } catch (e) {}
  firstHash = null;
  reset('Test effacé (l\'identité reste peut-être dans le gestionnaire de mots de passe de l\'appareil : sans importance).');
  verdict('pas encore de résultat.', 'wait');
};
</script>
</body>
</html>
